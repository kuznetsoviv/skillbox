---
- name: Setup skillbox gitlab runner
  hosts: gitlabrunner 
  become: yes
  vars:
    gitlab_runner_url: https://gitlab.skillbox.ru/
    gitlab_api_token: "{{ lookup('env', 'gitlab_api_token') }}" 
    runner_registration_token: "{{ lookup('env', 'runner_registration_token') }}"
    runner_description: "runner for skillbox service"
    runner_executor: "shell"
    runner_tags: "skillbox"    
  
  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present
        update_cache: yes

    - name: Add Gitlab repository public key
      apt_key:
        url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
        state: present

    - name: Add Gitlab Runner repository
      apt_repository:
        repo: deb https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ {{ ansible_distribution_release }} main        
        state: present
        filename: gitlab-runner

    - name: Install Gitlab Runner
      package:
        name: gitlab-runner
        state: present

    - name: Print a message
      debug:
        msg: "{{ runner_registration_token }}"

    - name: Register Gitlab Runner
      become: no
      community.general.gitlab_runner:
        api_url: "{{ gitlab_runner_url }}"
        api_token: "{{ gitlab_api_token }}"  
        registration_token: "{{ runner_registration_token }}"
        description: "{{ runner_description }}"
        executor: "{{ runner_executor }}"
        tags: "{{ runner_tags }}"
        state: present
      args:
        executable: gitlab-runner
      notify:
        - restart gitlab-runner        
     
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    
    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
    
    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
   
    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes  

  handlers:
    - name: restart gitlab-runner
      systemd:
        name: gitlab-runner
        state: restarted

