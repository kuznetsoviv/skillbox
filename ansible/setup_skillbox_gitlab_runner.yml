---
- name: Setup skillbox gitlab runner
  hosts: gitlabrunner 
  become: yes
  vars:
    gitlab_runner_coordinator_url: https://gitlab.skillbox.ru/
    gitlab_runner_registration_token: "{{ lookup('env','GITLAB_RUNNER_REGISTRATION_TOKEN') }}"
    gitlab_runner_description: "Runner for skillbox service"
    gitlab_runner_executor: "shell"
    gitlab_runner_tags: "skillbox"    
  
  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg  
        state: present
        update_cache: yes

    - name: Add Gitlab repository public key
      apt_key:
        url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
        state: present

    - name: Add Gitlab Runner repository
      apt_repository:
        repo: deb https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ {{ ansible_distribution_release }} main        
        state: present
        filename: gitlab-runner

    - name: Install Gitlab Runner
      package:
        name: gitlab-runner
        state: present
    
    - name: Ensure Gitlab Runner service is started and enabled
      service:
        name: gitlab-runner
        state: started
        enabled: yes      

    - name: Check if runner is already in config.toml
      shell: grep -q "{{ gitlab_runner_description }}" /etc/gitlab-runner/config.toml
      register: runner_check
      failed_when: false
      changed_when: false  

    - name: Register Gitlab Runner
      command: >
        gitlab-runner register
        --non-interactive
        --url "{{ gitlab_runner_coordinator_url }}"
        --registration-token "{{ gitlab_runner_registration_token }}"
        --executor "{{ gitlab_runner_executor }}"
        --description "{{ gitlab_runner_description }}"
        --tag-list "{{ gitlab_runner_tags }}"
      when: runner_check.rc != 0  

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    
    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
    
    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
   
    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes  
    
    - name: Add gitlab-runner to docker group
      user:
        name: gitlab-runner
        groups: docker
        append: yes      
    
    - name: Add Ansible PPA
      apt_repository:
        repo: ppa:ansible/ansible
        state: present

    - name: Install Ansible
      apt:
        name: ansible
        state: latest
        update_cache: yes      

