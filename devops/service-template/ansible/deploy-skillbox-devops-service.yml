---
- name: Deploy skillbox devops service
  hosts: all
  become: yes
  vars:
    service_version: 1.0
   
  tasks:
    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
    
    - name: Copy skillbox devops service unit file
      template:
        src: skillbox-devops-service.service.j2
        dest: /etc/systemd/system/skillbox-devops-service.service
    
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start skillbox devops service
      systemd:
        name: skillbox-devops-service.service
        enabled: yes
        state: started  
